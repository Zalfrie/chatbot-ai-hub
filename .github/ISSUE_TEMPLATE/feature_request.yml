name: Feature / update
description: Propose a new feature or a change to existing behavior
title: 'feat: '
labels: [enhancement]
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Backend API
        - Dashboard (frontend)
        - Embed widget
        - WhatsApp (Baileys)
        - AI provider / RAG / tools
        - CI / tooling
        - Other
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: What problem does this solve, and for whom (superadmin, UMKM admin, end customer)?
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Implementation hints, edge cases, related issues.
