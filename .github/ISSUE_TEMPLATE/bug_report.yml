name: Bug report
description: Something is broken or behaves unexpectedly
title: 'fix: '
labels: [bug]
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Backend API
        - Dashboard (frontend)
        - Embed widget
        - WhatsApp (Baileys)
        - AI provider / RAG / tools
        - Other
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Include the error message or a screenshot.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Click ...
        3. See error ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Environment and logs
      description: Branch or commit, browser, relevant log lines. Remove API keys, tokens, and customer phone numbers first.
      render: text
