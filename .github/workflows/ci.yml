name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: '22'

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Type-check
        run: npm run typecheck
      # DB, Redis and AI providers are mocked in tests, so no service containers are needed
      - name: Test (unit + integration, coverage thresholds)
        run: npm run test:coverage
      - name: Build
        run: npm run build
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-coverage
          path: backend/coverage/
          retention-days: 7
          if-no-files-found: ignore

  backend-start:
    name: Backend start
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    # The compiled server checks Postgres and Redis before it listens, so run it against real ones
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: chatbot_hub
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    # Throwaway values for the CI containers only. NODE_ENV is set on the start step alone,
    # because `npm ci` would skip the devDependencies (types, tsc) that the build needs
    env:
      PORT: '3000'
      DB_HOST: localhost
      DB_PORT: '5432'
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: chatbot_hub
      REDIS_HOST: localhost
      REDIS_PORT: '6379'
      JWT_SECRET: ci-only-jwt-secret-for-the-start-check
      WA_ENCRYPTION_KEY: abababababababababababababababababababababababababababababababab
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Start dist/index.js and wait for /health
        env:
          NODE_ENV: production
        run: npm run smoke

  migrations:
    name: Migrations
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: chatbot_hub
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    # Throwaway credentials of the CI container only
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/chatbot_hub
      MIGRATION_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Schema changes have a migration
        timeout-minutes: 2
        run: |
          npx drizzle-kit generate --name schema_drift_check
          if [ -n "$(git status --porcelain src/db/migrations)" ]; then
            echo "::error::The Drizzle schema has changes without a migration. Run 'npm run db:generate' and commit the result."
            git status --porcelain src/db/migrations
            exit 1
          fi
      - name: Migration tests (new database, database at 0002, at 0002 + 0004)
        run: npm run test:migrations
      - name: db:migrate on an empty database, then again as a no-op
        run: npm run db:migrate && npm run db:migrate


  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci # postinstall runs `nuxt prepare`, which generates the .nuxt types
      - name: Type-check
        run: npm run typecheck
      - name: Build
        run: npm run build

  widget:
    name: Widget
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: widget
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: widget/package-lock.json
      - name: Enforce zero runtime dependencies
        run: |
          node -e "
            const deps = Object.keys(require('./package.json').dependencies || {});
            if (deps.length) {
              console.error('The embed widget must stay zero-dependency, found: ' + deps.join(', '));
              process.exit(1);
            }
          "
      - name: Install dependencies
        run: npm ci
      - name: Type-check
        run: npm run typecheck
      - name: Build
        run: npm run build

  pr-title:
    name: PR title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check Conventional Commits format
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|perf|refactor|docs|test|chore|ci|build|security|revert)(\([a-z0-9._/-]+\))?!?: .+'
          if [[ ! "$TITLE" =~ $pattern ]]; then
            echo "::error::PR title must follow Conventional Commits, e.g. 'fix(frontend): ...' or 'feat: ...'"
            echo "Got: $TITLE"
            exit 1
          fi

  # Single status check for branch protection: require "CI passed" instead of each job
  ci-passed:
    name: CI passed
    if: always()
    needs: [backend, backend-start, migrations, frontend, widget, pr-title]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Fail if any job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
      - run: echo "All CI jobs passed."
